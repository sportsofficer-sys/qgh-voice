[build]
  command = "node scripts/build-web.mjs"
  publish = "apps/web/dist"

[build.environment]
  NODE_VERSION = "22"

# Preserve the exact .html routes cached by the offline service worker.
[build.processing.html]
  pretty_urls = false

[[headers]]
  for = "/manifest.webmanifest"
  [headers.values]
    Content-Type = "application/manifest+json; charset=utf-8"

# Generate the PWA from the shared simulator source. The output folder is
# deliberately ignored by Git and must be built on every deployment.
