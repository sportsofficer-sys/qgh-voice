name: Deploy QGH PWA to GitHub Pages

on:
  push:
    branches:
      - main
    paths:
      - apps/web/**
      - packages/qgh-engine/**
      - scripts/build-web.mjs
      - .github/workflows/deploy-pages.yml
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: github-pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Check out source
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - name: Set up Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 22
      - name: Validate simulator and web package
        run: node --test packages/qgh-engine/test/*.test.js apps/web/test/build-web.test.mjs apps/web/test/service-worker.test.mjs
      - name: Build web package
        run: node scripts/build-web.mjs
      - name: Upload GitHub Pages artifact
        uses: actions/upload-pages-artifact@7b1f4a764d45c48632c6b24a0339c27f5614fb0b # v4
        with:
          path: apps/web/dist

  deploy:
    # A manually dispatched workflow may be started from another branch.  Never
    # let that publish to the public Pages environment.
    if: github.ref == 'refs/heads/main'
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@d6db90164ac5ed86f2b6aed7e0febac5b3c0c03e # v4
